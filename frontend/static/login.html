<!doctype html>
<html lang="{{LANG_HTML}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{TITLE}}</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#20332e;background:#f3f5f0;font-size:15px}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:430px;padding:42px 36px 34px;background:#fff;border:1px solid #e1e8df;border-radius:20px;box-shadow:0 18px 70px #16332b0b}.brand{display:flex;gap:12px;align-items:center;margin-bottom:34px;color:#163b32;font-size:25px;font-weight:650;letter-spacing:3px}.mark{display:flex;gap:4px;align-items:flex-end;height:30px;transform:skewY(-10deg)}.mark i{display:block;width:8px;border-radius:2px;background:#77a68c}.mark i:nth-child(1){height:16px}.mark i:nth-child(2){height:30px;background:#235d4d}.mark i:nth-child(3){height:23px;background:#bbd0a9}.eyebrow{color:#829285;font-size:10px;letter-spacing:2px;margin:0 0 9px}h1{font-size:25px;margin:0 0 12px;font-weight:650;letter-spacing:-.5px}.intro{font-size:13px;line-height:1.8;color:#7b897e;margin:0 0 27px}label{display:block;font-size:12px;font-weight:600;margin-bottom:9px}input{width:100%;padding:13px 14px;border:1px solid #dce4d8;border-radius:9px;background:#fcfdfb;color:#24382d;font:inherit;font-size:15px;outline:none}input:focus{border-color:#548e76;box-shadow:0 0 0 3px #548e7617}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#1c7769;color:white;font:inherit;font-size:14px;font-weight:550;cursor:pointer}button:hover{background:#175f54}button:focus-visible{outline:3px solid #91b7a1;outline-offset:3px}.note{margin:22px 0 0;font-size:11px;line-height:1.8;color:#869184}.error{margin:0 0 20px;padding:11px 13px;border-radius:8px;background:#fbefe8;color:#9c4732;font-size:12px;line-height:1.7}.hidden{display:none}.footer{font-size:10px;color:#9aa591;text-align:center;margin-top:28px;letter-spacing:.4px}@media(max-width:480px){body{padding:18px}.card{padding:32px 25px}.brand{margin-bottom:29px}}
    .language-switch{display:flex;justify-content:flex-end;gap:4px;margin-bottom:24px}.language-switch a{font-size:12px;color:#5c7165;padding:5px 9px;border-radius:6px;text-decoration:none;letter-spacing:0}.language-switch a[aria-current="page"]{color:#175f54;background:#e8f2ed;font-weight:600}.language-switch a:focus-visible{outline:3px solid #91b7a1;outline-offset:2px}html[lang="en"] .brand{letter-spacing:.2px}html[lang="en"] h1{font-size:23px}html[lang="en"] .footer{letter-spacing:0}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <nav class="language-switch" aria-label="{{LANGUAGE_LABEL}}"><a href="/login?lang=zh" lang="zh-CN" aria-current="{{ZH_CURRENT}}">中文</a><a href="/login?lang=en" lang="en" aria-current="{{EN_CURRENT}}">English</a></nav>
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>{{BRAND}}</div>
      <p class="eyebrow">WEEKLY AD INTELLIGENCE</p>
      <h1>{{HEADING}}</h1>
      <p class="intro">{{INTRO}}</p>
      <div class="error {{ERROR_CLASS}}" role="alert">{{ERROR}}</div>
      <form id="loginForm" action="/login?lang={{LANG}}" method="post">
        <label for="password">{{PASSWORD_LABEL}}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="16" maxlength="512" required autofocus placeholder="{{PASSWORD_PLACEHOLDER}}">
        <button type="submit">{{SUBMIT}}</button>
      </form>
      <p class="note">{{NOTE}}</p>
    </section>
    <p class="footer">{{FOOTER}}</p>
  </main>
</body>
</html>
